[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "advisorai-backend"
version = "0.1.0"
description = "AdvisorAI backend: FastAPI service for second-opinion preparation (decision support, not medical advice)."
readme = "README.md"
# No Python target existed in the repository or blueprint before Phase 2A, so 3.12 is a stated
# decision (docs/adr/0003-python-target-and-lockfile.md), not an inherited one. CI runs 3.12 and
# 3.13. Do not change it without an ADR.
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "mypy>=1.11",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]
