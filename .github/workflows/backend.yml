name: backend

on:
  push:
    branches: [develop]
    paths:
      - "backend/**"
      - "workflows/**"
      - "registry/**"
      - "n8n/**"
      - "scripts/**"
      - "frontend/src/domain/**"
      - "frontend/src/mocks/**"
      - "frontend/src/lib/api/http/**"
      - "frontend/src/__tests__/fixtures/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "workflows/**"
      - "registry/**"
      - "n8n/**"
      - "scripts/**"
      - "frontend/src/domain/**"
      - "frontend/src/mocks/**"
      - "frontend/src/lib/api/http/**"
      - "frontend/src/__tests__/fixtures/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.22"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Fails if uv.lock no longer matches pyproject.toml (re-run `uv lock` and commit it).
      - run: uv lock --check
      # Install EXACTLY what the lockfile pins (no re-resolution) on each Python in the matrix.
      - run: uv sync --locked --extra dev --python ${{ matrix.python }}
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      # Integration tests need the Supabase stack and skip themselves here; the `supabase` workflow runs them.
      - run: uv run --no-sync pytest

  # The backend contract tests read fixtures generated from the frontend scenarios. This job fails
  # if the checked-in fixtures no longer match what the scenarios produce (run
  # `npm run export:fixtures` in frontend/ and commit the result).
  fixtures-in-sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run src/__tests__/fixtures src/__tests__/http
